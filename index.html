<script>
/* ---------- utilities ---------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=mulberry32(20261123);
const rnd=(a,b)=>a+(b-a)*R(), ri=(a,b)=>Math.round(rnd(a,b)), pick=a=>a[Math.floor(R()*a.length)];
const r50=x=>Math.round(x/50)*50, r10=x=>Math.round(x/10)*10;
const m=f=>Math.round(f*0.3048);
const ftm=f=>`${Math.round(f).toLocaleString('en-IN')} ft <span class="muted small">(${m(f)} m)</span>`;
const inr=n=>'₹'+Math.round(n).toLocaleString('en-IN');
const lakh=n=>'₹'+(n/100000).toFixed(2)+' L';
const sortN=a=>[...a].sort((x,y)=>x-y);
const pct=(a,p)=>{if(!a.length)return null;const s=sortN(a);const i=(s.length-1)*p,lo=Math.floor(i),hi=Math.ceil(i);return s[lo]+(s[hi]-s[lo])*(i-lo)};
const med=a=>pct(a,.5);
const fmtD=d=>d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2200)}

function drillCost(d){let c=0,prev=0,rows=[];for(const[upto,rate]of SLABS){if(d<=prev)break;const seg=Math.min(d,upto)-prev;c+=seg*rate;rows.push({from:prev,to:prev+seg,rate,amt:seg*rate});prev=upto}return{c,rows}}

const stdCost=(d,cas)=>drillCost(d).c+cas*CASING_RATE+MOB+FLUSH;

];

/* ---------- historical jobs ---------- */
function makeLog(depth,ovb,strikes){
 const ts=ri(8,18);let bps=new Set([0,ts,ovb,depth]);
 strikes.forEach(s=>{bps.add(Math.max(ovb+5,s-20));bps.add(Math.min(depth,s+15))});
 for(let d=ovb+ri(60,120);d<depth-30;d+=ri(70,140))bps.add(d);
 const pts=sortN([...bps]).filter(x=>x<=depth);const log=[];
 for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1];if(b-a<3)continue;let f,obs='';
  if(b<=ts)f='Topsoil';else if(b<=ovb)f='Weathered rock';
  else{const w=strikes.filter(s=>s>=a&&s<=b);if(w.length){f='Fractured gneiss';obs='Water strike at '+w.join(', ')+' ft'}else f=R()<.22?'Fractured gneiss':'Hard granite gneiss'}
  if(f==='Fractured gneiss'&&!obs)obs='Fractured, dry';if(f==='Hard granite gneiss')obs=pick(['Grey cuttings','Dark grey fine cuttings','Pinkish cuttings','Grey, compact']);if(f==='Weathered rock')obs='Brown murrum / weathered';if(f==='Topsoil')obs='Red soil';
  const rate=FORM[f].rate*rnd(.82,1.18);log.push({from:a,to:b,form:f,rate:+rate.toFixed(1),diesel:Math.round((b-a)*DIESEL_LPH/rate),obs})}
 return log}
const JOBS=[];
(function(){const start=new Date(2024,3,1);const dists=Object.keys(REG);
 for(let i=0;i<72;i++){const dist=pick(dists),g=REG[dist],block=pick(g.blocks);const use=R()<.7?'Agriculture':R()<.85?'Domestic':'Industrial';
  const planned=r50((g.strike[0]+g.strike[1])/2+180);const ovb=ri(...g.ovb);const cas=r10(ovb+ri(5,15));const u=R();let outcome,strikes=[],depth,yld;
  if(u<g.succ){outcome='Success';const s1=ri(g.strike[0],g.strike[1]);strikes=[s1];if(R()<.4)strikes.push(s1+ri(60,200));depth=r10(Math.max(...strikes)+ri(40,160));yld=ri(...g.y)}
  else if(u<g.succ+(1-g.succ)*.45){outcome='Low yield';const s1=ri(g.strike[0],g.strike[1]+100);strikes=[s1];depth=r10(s1+ri(60,200));yld=ri(300,1000)}
  else{outcome='Dry';depth=r10(g.strike[1]+ri(80,300));yld=0}
  const date=new Date(start.getTime()+i*9.6*864e5+ri(0,4)*864e5);const quote=stdCost(planned,cas);const actual=stdCost(depth,cas)*rnd(.96,1.07);
  const log=makeLog(depth,ovb,strikes);const id='BW-'+String(date.getFullYear()).slice(2)+'-'+String(100+i).padStart(3,'0');
  JOBS.push({id,cust:pick(CUST),date,dist,block,use,rig:pick(RIGS).id,planned,depth,ovb,cas,strikes,yld,outcome,quote,actual,log,gps:R()>.1,pump:outcome!=='Dry'&&R()>.25,diesel:log.reduce((s,l)=>s+l.diesel,0)})}})();

 {id:'BW-26-121',cust:'Thangam Dairy',dist:'Madurai',block:'Melur',use:'Agriculture',rig:'R-04',planned:750,cur:330,strikes:[265],started:new Date(2026,10,21),planDays:3,ovb:40,cas:50},

 {d:'19 Nov',job:'BW-26-122',rig:'R-06',form:'Hard granite gneiss',ft:230,hrs:16.0,diesel:505},

/* ---------- views ---------- */
const NAV=[

/* exceptions engine */
function getExceptions(){const E=[];
 DAILY.forEach(x=>x.flags.forEach(f=>E.push({sev:f[1],area:'Drilling',ref:`${x.job} / ${x.rig} / ${x.d}`,msg:f[0],go:'ai-anomaly'})));
 ACTIVE.forEach(a=>{const days=Math.round((new Date(2026,10,23)-a.started)/864e5);if(days>a.planDays)E.push({sev:'warn',area:'Schedule',ref:a.id,msg:`Day ${days} of planned ${a.planDays} – delay`,go:'jobs'});
  if(!a.strikes.length&&a.cur>=a.planned*.8)E.push({sev:'bad',area:'Depth',ref:a.id,msg:`No water strike at ${a.cur} ft (${Math.round(a.cur/a.planned*100)}% of planned) – checkpoint decision needed`,go:'ai-checkpoint'})});
 RIGS.forEach(r=>{const s=rigRisk(r);if(s.score>=70)E.push({sev:'bad',area:'Rig',ref:r.id,msg:'High maintenance risk ('+s.score+'): '+s.why[0],go:'ai-rig'});if(r.status==='Idle')E.push({sev:'warn',area:'Rig',ref:r.id,msg:'Rig idle – assign to pending enquiry',go:'rigs'})});
 INVOICES.filter(i=>i.amt>i.paid&&i.age>30).forEach(i=>E.push({sev:i.age>60?'bad':'warn',area:'Collections',ref:i.no,msg:`${inr(i.amt-i.paid)} overdue ${i.age} days – ${i.cust}`,go:'billing'}));
 INV.filter(x=>x.stock<=x.reorder).forEach(x=>E.push({sev:'warn',area:'Inventory',ref:x.item,msg:`Stock ${x.stock} ${x.uom} at/below reorder level ${x.reorder}`,go:'inventory'}));
 const nogps=DONE.slice(-30).filter(j=>!j.gps);if(nogps.length)E.push({sev:'warn',area:'Data quality',ref:nogps.map(j=>j.id).join(', '),msg:'Completed jobs without GPS – excluded from Site Intelligence',go:'ai-site'});
 return E.sort((a,b)=>(a.sev==='bad'?0:1)-(b.sev==='bad'?0:1))}

 <p class="small muted">From the company's own completed bore records (sample).</p></div></div>

 return banner()+`<div class="card"><h3>New site input</h3><div class="fg">
 <div><label>District</label><select id="si-d" onchange="siChange()">${Object.keys(REG).map(d=>`<option ${d===s.dist?'selected':''}>${d}</option>`).join('')}</select></div>
 <div><label>Block</label><select id="si-b">${g.blocks.map(b=>`<option ${b===s.block?'selected':''}>${b}</option>`).join('')}</select></div>

 <div class="chk" style="margin-top:10px"><label style="color:var(--mut)">Survey information available</label>${['GPS coordinates captured','Geophysical / resistivity survey report','Nearby well data (depth, yield, age)','Rig access confirmed','Power / water requirement confirmed'].map((t,i)=>`<label><input type="checkbox" class="si-c" ${s.chk[i]?'checked':''}> ${t}</label>`).join('')}</div>
 <div style="margin-top:10px"><button class="btn" onclick="siRun()">Run AI site assessment</button></div></div><div id="si-out"></div>`};
function siChange(){const d=document.getElementById('si-d').value;document.getElementById('si-b').innerHTML=REG[d].blocks.map(b=>`<option>${b}</option>`).join('')}
function siRun(){const s=SEL.site;s.dist=document.getElementById('si-d').value;s.block=document.getElementById('si-b').value;s.use=document.getElementById('si-u').value;s.target=+document.getElementById('si-t').value||0;s.chk=[...document.querySelectorAll('.si-c')].map(c=>c.checked);
 const pool=DONE.filter(j=>j.gps);let comp=pool.filter(j=>j.block===s.block),scope='block '+s.block;if(comp.length<6){comp=pool.filter(j=>j.dist===s.dist);scope='district '+s.dist+' (block has <6 records)'}
 const n=comp.length,succ=comp.filter(j=>j.outcome==='Success'),low=comp.filter(j=>j.outcome==='Low yield'),dry=comp.filter(j=>j.outcome==='Dry');
 const fs=comp.filter(j=>j.strikes.length).map(j=>j.strikes[0]);const fd=succ.map(j=>j.depth);const yl=succ.map(j=>j.yld);
 const conf=n>=12?['High','ok']:n>=5?['Medium','warn']:['Low','bad'];
 const p25=pct(fd,.25),p75=pct(fd,.75),p90=pct(fd,.9);const cas=r10(med(comp.map(j=>j.ovb))+10);
 const missing=['GPS coordinates','Geophysical / resistivity survey','Nearby well data','Rig access','Power / water requirement'].filter((x,i)=>!s.chk[i]);
 const warns=[];if(s.target<pct(fs,.25))warns.push(`Target ${s.target} ft is shallower than 75% of recorded first water strikes here (P25 ${Math.round(pct(fs,.25))} ft). Discuss realistic depth before quoting.`);
 if(s.target>p90)warns.push(`Target ${s.target} ft is deeper than 90% of successful bores here (P90 ${Math.round(p90)} ft). Confirm reason (survey indication / customer request) and agree a stop rule.`);
 if(dry.length/n>.3)warns.push(`Dry-bore rate is ${Math.round(dry.length/n*100)}% in comparable records – insist on a geophysical survey and depth checkpoints.`);
 const sim=[...comp].sort((a,b)=>Math.abs(a.depth-s.target)-Math.abs(b.depth-s.target)).slice(0,8);
 document.getElementById('si-out').innerHTML=`<div class="grid g4"><div class="kpi"><small>Comparable bores (${scope})</small><b>${n}</b><i>Confidence: ${pill(conf[0],conf[1])}</i></div>
 <div class="kpi"><small>Outcomes ${S.rec}</small><b>${Math.round(succ.length/n*100)}% success</b><i>${Math.round(low.length/n*100)}% low yield · ${Math.round(dry.length/n*100)}% dry</i></div>
 <div class="kpi"><small>First water strike ${S.rec}</small><b>${Math.round(med(fs))} ft</b><i>P25–P75: ${Math.round(pct(fs,.25))}–${Math.round(pct(fs,.75))} ft</i></div>
 <div class="kpi"><small>Yield of successful bores ${S.rec}</small><b>${Math.round(med(yl)).toLocaleString('en-IN')} LPH</b><i>Range ${Math.min(...yl).toLocaleString('en-IN')}–${Math.max(...yl).toLocaleString('en-IN')}</i></div></div>
 <div class="grid g2" style="margin-top:14px"><div class="card"><h3>Preliminary depth & cost scenario ${S.est}</h3><table>
 <tr><th>Scenario</th><th class="num">Depth</th><th class="num">Estimated cost</th></tr>
 <tr><td>Optimistic (P25 of successful depths)</td><td class="num">${ftm(r10(p25))}</td><td class="num">${inr(stdCost(r10(p25),cas))}</td></tr>
 <tr><td><b>Likely (median)</b></td><td class="num"><b>${ftm(r10(med(fd)))}</b></td><td class="num"><b>${inr(stdCost(r10(med(fd)),cas))}</b></td></tr>
 <tr><td>Conservative (P75)</td><td class="num">${ftm(r10(p75))}</td><td class="num">${inr(stdCost(r10(p75),cas))}</td></tr>
 <tr><td>Customer target</td><td class="num">${ftm(s.target)}</td><td class="num">${inr(stdCost(s.target,cas))}</td></tr></table>
 <p class="small muted">Casing assumed ${cas} ft (median overburden + 10 ft). Suggested checkpoints: ${[Math.round(pct(fs,.5)/50)*50,r50(p75),r50(p90)].filter((v,i,a)=>a.indexOf(v)===i).join(' ft, ')} ft.</p></div>
 <div class="card"><h3>AI observations ${S.ai}</h3>${warns.length?warns.map(w=>`<div class="adv warn" style="margin-top:6px">${w}</div>`).join(''):'<div class="adv ok">Target depth is within the recorded range for comparable bores.</div>'}
 <h4>Missing survey information</h4>${missing.length?`<ul class="clean">${missing.map(x=>`<li>${x}</li>`).join('')}</ul>`:'<p class="small">None – all key inputs captured.</p>'}
 <h4>External datasets</h4><p class="small">${S.ext} Groundwater level / aquifer / geology layers – <b>not connected in demo</b>. In production, show source name & date for each layer.</p></div></div>
 <div class="card"><h3>Most similar recorded bores ${S.rec}</h3><div class="tw"><table><tr><th>Job</th><th>Date</th><th>Block</th><th>Purpose</th><th class="num">Depth</th><th class="num">Overburden</th><th>Strikes</th><th class="num">Yield LPH</th><th>Outcome</th></tr>${sim.map(j=>`<tr><td><a href="#ai-borelog" onclick="SEL.bore='${j.id}'">${j.id}</a></td><td>${fmtD(j.date)}</td><td>${j.block}</td><td>${j.use}</td><td class="num">${j.depth} ft</td><td class="num">${j.ovb} ft</td><td>${j.strikes.join(', ')||'–'}</td><td class="num">${j.yld?j.yld.toLocaleString('en-IN'):'–'}</td><td>${outPill(j.outcome)}</td></tr>`).join('')}</table></div></div>
 <div class="banner blue">Recommendation status: <b>AI-generated preliminary assessment – requires expert review.</b> Not a groundwater guarantee and not a substitute for a qualified hydrogeological assessment. Underground conditions are never invented: every figure above is either a recorded observation or a labelled estimate.</div>`}

 <div><label>Planned depth (ft)</label><input id="ck-p" type="number" value="${a.planned}"></div>
 <div><label>Current depth (ft)</label><input id="ck-c" type="number" value="${a.cur}"></div>
 <div><label>Water strikes so far (ft, comma)</label><input id="ck-s" value="${a.strikes.join(', ')}"></div>
 <div><label>Current discharge estimate (LPH)</label><input id="ck-q" type="number" value="${a.strikes.length?1200:0}"></div>
 <div><label>Required yield (LPH)</label><input id="ck-r" type="number" value="${a.use==='Agriculture'?2500:a.use==='Industrial'?4000:800}"></div>
 <div><label>Customer budget ceiling (₹)</label><input id="ck-b" type="number" value="${Math.round(stdCost(a.planned+100,a.cas)/1000)*1000}"></div>
 <div><label>Next decision step (ft)</label><input id="ck-n" type="number" value="100"></div></div>
 <div style="margin-top:10px"><button class="btn" onclick="ckRun()">Assess checkpoint</button></div></div><div id="ck-out"></div>
 <div class="card"><h3>Decision audit log</h3><div id="ck-audit"></div></div>`};
function ckRun(){const a=ACTIVE.find(x=>x.id===SEL.ck);const P=+val('ck-p'),C=+val('ck-c'),Q=+val('ck-q'),Rq=+val('ck-r'),B=+val('ck-b'),N=+val('ck-n')||100;const st=val('ck-s').split(',').map(x=>+x.trim()).filter(Boolean);
 const pool=DONE.filter(j=>j.dist===a.dist);const reached=pool.filter(j=>j.depth>C&&!j.strikes.some(s=>s<=C));const found=reached.filter(j=>j.strikes.some(s=>s>C&&s<=C+N)&&j.outcome!=='Dry');
 const p=reached.length?found.length/reached.length:null;const costNow=stdCost(C,a.cas),costNext=stdCost(C+N,a.cas),inc=costNext-costNow;
 let adv,c;if(Q>=Rq){adv=`Required yield appears met (${Q} ≥ ${Rq} LPH). Suggest: stop drilling, flush, and run a pump test to confirm.`;c='ok'}
 else if(costNext>B){adv=`Next ${N} ft would take cost to ${inr(costNext)}, above the customer ceiling ${inr(B)}. Suggest: pause and take written customer consent before continuing, or stop.`;c='bad'}
 else if(p!==null&&p<.15&&C>=P){adv=`Low historical chance (${Math.round(p*100)}%) of a new strike in the next ${N} ft, and planned depth reached. Suggest: review with customer and site expert – stopping is reasonable.`;c='bad'}
 else if(p!==null&&p<.25){adv=`Historical chance of a strike in the next ${N} ft is ${Math.round(p*100)}%. Suggest: review with customer before continuing; record decision.`;c='warn'}
 else{adv=`Continue to ${C+N} ft and re-check. Historical chance of a strike in the next ${N} ft: ${p===null?'insufficient data':Math.round(p*100)+'%'}.`;c='ok'}
 document.getElementById('ck-out').innerHTML=`<div class="grid g4"><div class="kpi"><small>Cost to date (standard rates)</small><b>${inr(costNow)}</b><i>${C} ft drilled</i></div><div class="kpi"><small>Cost of next ${N} ft</small><b>${inr(inc)}</b><i>Slab rate ${drillCost(C+N).rows.slice(-1)[0].rate} ₹/ft</i></div><div class="kpi"><small>Comparable bores that reached ${C} ft dry ${S.rec}</small><b>${reached.length}</b><i>${a.dist} district</i></div><div class="kpi"><small>Of those, struck water in next ${N} ft ${S.est}</small><b>${p===null?'n/a':Math.round(p*100)+'%'}</b><i>${found.length} of ${reached.length}${reached.length<5?' · low confidence':''}</i></div></div>
 <div class="card" style="margin-top:14px"><h3>AI advisory ${S.ai}</h3><div class="adv ${c}">${adv}</div><p class="small muted" style="margin-top:8px">Water strikes recorded: ${st.length?st.join(', ')+' ft':'none'}. The AI does not decide depth. The site engineer records the decision and the customer's consent for extra depth.</p>
 <div class="row" style="margin-top:8px"><button class="btn ok" onclick="ckDecide('Continue to ${C+N} ft')">Approve: continue to ${C+N} ft</button><button class="btn sec" onclick="ckDecide('Pause – customer review at ${C} ft')">Pause for customer review</button><button class="btn bad" onclick="ckDecide('Stop at ${C} ft')">Stop drilling</button></div></div>`;renderAudit()}
function ckDecide(t){AUDIT.unshift({t:new Date().toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}),who:'Site Engineer (demo user)',act:SEL.ck+': '+t,det:'AI advisory shown; consent reference required for extra depth'});renderAudit();toast('Decision recorded in audit log')}
function renderAudit(){const e=document.getElementById('ck-audit');if(e)e.innerHTML=`<table><tr><th>Time</th><th>By</th><th>Decision</th><th>Note</th></tr>${AUDIT.map(a=>`<tr><td>${a.t}</td><td>${a.who}</td><td><b>${a.act}</b></td><td class="small">${a.det}</td></tr>`).join('')}</table>`}
const val=id=>document.getElementById(id).value;

/* ---- AI: Bore log ---- */
V['ai-borelog']=()=>{const j=JOBS.find(x=>x.id===SEL.bore)||DONE[DONE.length-1];SEL.bore=j.id;
 const peers=DONE.filter(x=>x.dist===j.dist&&x.id!==j.id);const pOvb=med(peers.map(x=>x.ovb)),pStr=med(peers.filter(x=>x.strikes.length).map(x=>x.strikes[0]));
 const frac=j.log.filter(l=>l.form==='Fractured gneiss');const hard=j.log.filter(l=>l.form==='Hard granite gneiss').reduce((s,l)=>s+l.to-l.from,0);
 const notes=[];notes.push(`Overburden (soil + weathered) ${j.ovb} ft vs district median ${Math.round(pOvb)} ft.`);
 if(j.cas<j.ovb+5)notes.push(`⚠ Casing ${j.cas} ft is less than overburden + 5 ft – risk of caving; verify casing record.`);else notes.push(`Casing ${j.cas} ft covers overburden.`);
 notes.push(`${frac.length} fractured zone(s): ${frac.map(l=>l.from+'–'+l.to+' ft').join(', ')||'none'}.`);
 notes.push(j.strikes.length?`First strike at ${j.strikes[0]} ft vs district median ${Math.round(pStr)} ft (${j.strikes[0]<pStr?'shallower':'deeper'}).`:'No water strike recorded – include in dry-bore pattern analysis.');
 notes.push(`Hard rock ${Math.round(hard/j.depth*100)}% of bore length; diesel ${j.diesel} L (${(j.diesel/j.depth).toFixed(2)} L/ft).`);
 if(!j.pump&&j.outcome!=='Dry')notes.push('⚠ Pump test not recorded – yield is a field estimate only.');
 return banner()+`<div class="card"><div class="row"><div style="min-width:260px"><label>Borewell</label><select onchange="SEL.bore=this.value;route()">${DONE.slice().reverse().map(x=>`<option value="${x.id}" ${x.id===j.id?'selected':''}>${x.id} · ${x.block} · ${x.outcome}</option>`).join('')}</select></div></div></div>
 <div><div class="card"><h3>Depth-wise bore log ${S.rec}</h3><div class="row" style="margin-bottom:8px">${pill(j.outcome,j.outcome==='Success'?'ok':j.outcome==='Dry'?'bad':'warn')}<span class="small">${j.cust} · ${j.block}, ${j.dist} · ${fmtD(j.date)} · Rig ${j.rig}</span></div>
 <div style="display:flex;gap:14px"><div>${boreSvg(j)}</div><div class="tw" style="flex:1"><table class="log"><tr><th>From–To (ft)</th><th>Formation</th><th class="num">ft/hr</th><th class="num">Diesel L</th><th>Observation</th></tr>${j.log.map(l=>`<tr><td>${l.from}–${l.to}</td><td class="form">${l.form}</td><td class="num">${l.rate}</td><td class="num">${l.diesel}</td><td class="small">${l.obs.startsWith('Water')?'💧 <b>'+l.obs+'</b>':l.obs}</td></tr>`).join('')}</table></div></div></div>
 <div class="card"><h3>Geological pattern summary ${S.ai}</h3><ul class="clean">${notes.map(n=>`<li>${n}</li>`).join('')}</ul>
 <h4>Regional pattern (${j.dist}) ${S.est}</h4><p class="small">Successful bores here usually strike water in a fractured gneiss zone below the weathered layer; ${Math.round(peers.filter(x=>x.strikes.length>1).length/peers.length*100)}% recorded a second strike. Pattern statements are statistics from own records, not geological interpretation.</p>
 <h4>Data standard used</h4><p class="small">Every 10–20 ft or formation change: depth from/to, formation (pick list), cuttings colour/photo, penetration rate, air/water return, strikes with estimated discharge, diesel and hammer/bit used.</p></div></div>`};
function boreSvg(j){const H=360,W=70,sc=H/j.depth;const col={'Topsoil':'#c98d5b','Weathered rock':'#d8b98a','Fractured gneiss':'#7fa7c4','Hard granite gneiss':'#6f7a86'};
 return `<svg width="${W+40}" height="${H+20}" viewBox="0 0 ${W+40} ${H+20}">${j.log.map(l=>`<rect x="30" y="${l.from*sc+5}" width="${W-30}" height="${Math.max(1,(l.to-l.from)*sc)}" fill="${col[l.form]}"><title>${l.from}-${l.to} ft ${l.form}</title></rect>`).join('')}${j.strikes.map(s=>`<line x1="24" x2="${W+4}" y1="${s*sc+5}" y2="${s*sc+5}" stroke="#0e9fb8" stroke-width="2.5"/><text x="${W+6}" y="${s*sc+9}" font-size="10" fill="#0b6e99">${s}</text>`).join('')}${[0,.25,.5,.75,1].map(f=>`<text x="0" y="${f*H+9}" font-size="9" fill="#5b6b80">${Math.round(f*j.depth)}</text>`).join('')}</svg>`}

<div class="card"><h3>How expected values are set ${S.est}</h3><table><tr><th>Formation</th><th class="num">Expected ft/hr</th><th class="num">Expected diesel L/ft</th></tr>${Object.keys(FORM).map(f=>`<tr><td>${f}</td><td class="num">${FORM[f].rate}</td><td class="num">${expL(f).toFixed(2)}</td></tr>`).join('')}</table><p class="small muted">Demo baseline: rig + compressor ≈ ${DIESEL_LPH} L/hr. In production the baseline is learned per rig and formation from own logs, and flags feed the Exception Monitor. Flags are prompts to verify – never accusations.</p></div>`;

/* ---- AI: Cost ---- */
function quoteCalc(d,cas,dist,extra=0){const base=stdCost(d,cas)+extra;const hist=DONE.filter(j=>j.dist===dist);const ratios=hist.map(j=>j.actual/j.quote);const p50=base*Math.max(1,med(ratios)),p80=base*Math.max(1,pct(ratios,.8));
 const over=hist.filter(j=>j.depth>j.planned).length/hist.length;return{base,p50,p80,ratios,over,note:`${Math.round(over*100)}% of ${dist} bores went deeper than planned; median actual/quote ${med(ratios).toFixed(2)}×`}}
V['ai-cost']=()=>banner()+`<div class="grid g2"><div class="card"><h3>Quotation inputs</h3><div class="fg">
<div><label>District</label><select id="qc-d">${Object.keys(REG).map(d=>`<option>${d}</option>`).join('')}</select></div>
<div><label>Quoted depth (ft)</label><input id="qc-dep" type="number" value="800"></div>
<div><label>Casing length (ft)</label><input id="qc-c" type="number" value="60"></div>
<div><label>Casing rate (₹/ft)</label><input id="qc-cr" type="number" value="${CASING_RATE}"></div>
<div><label>Distance from base (km)</label><input id="qc-km" type="number" value="45"></div>
<div><label>Transport ₹/km (rig + support)</label><input id="qc-kr" type="number" value="90"></div>
<div><label>Tax %</label><input id="qc-g" type="number" value="18"></div></div>
<h4>Depth slab rates (₹ per foot) – editable</h4><div class="fg" id="qc-slabs">${SLABS.map((s,i)=>`<div><label>${i?SLABS[i-1][0]+1:0}–${s[0]>9999?'above':s[0]} ft</label><input type="number" value="${s[1]}" data-i="${i}"></div>`).join('')}</div>
<div style="margin-top:10px"><button class="btn" onclick="qcRun()">Calculate quote</button></div></div><div id="qc-out"></div></div>`;
function qcRun(){document.querySelectorAll('#qc-slabs input').forEach(e=>SLABS[+e.dataset.i][1]=+e.value);const d=+val('qc-dep'),cas=+val('qc-c'),cr=+val('qc-cr'),km=+val('qc-km'),kr=+val('qc-kr'),g=+val('qc-g'),dist=val('qc-d');
 const dc=drillCost(d);const casing=cas*cr,trans=km*2*kr;const sub=dc.c+casing+MOB+FLUSH+trans;const q=quoteCalc(d,cas,dist,trans+casing-cas*CASING_RATE);const tax=sub*g/100;
 const txt=`Borewell quotation – ${dist}\nDepth: ${d} ft (${m(d)} m), DTH drilling\n${dc.rows.map(r=>`  ${r.from}-${r.to} ft @ ₹${r.rate}/ft = ${inr(r.amt)}`).join('\n')}\nCasing ${cas} ft @ ₹${cr}/ft = ${inr(casing)}\nMobilisation ${inr(MOB)} · Flushing ${inr(FLUSH)} · Transport ${inr(trans)}\nSub-total ${inr(sub)} + tax ${g}% ${inr(tax)} = ${inr(sub+tax)}\nDepth beyond ${d} ft only with your written consent, at the slab rate for that depth.\nWater availability and yield cannot be guaranteed.`;
 document.getElementById('qc-out').innerHTML=`<div class="card"><h3>Quote breakdown</h3><table><tr><th>Line</th><th class="num">Amount</th></tr>${dc.rows.map(r=>`<tr><td>${r.from}–${r.to} ft @ ₹${r.rate}/ft</td><td class="num">${inr(r.amt)}</td></tr>`).join('')}<tr><td>Casing ${cas} ft @ ₹${cr}</td><td class="num">${inr(casing)}</td></tr><tr><td>Mobilisation + flushing</td><td class="num">${inr(MOB+FLUSH)}</td></tr><tr><td>Transport ${km} km × 2</td><td class="num">${inr(trans)}</td></tr><tr><td><b>Sub-total</b></td><td class="num"><b>${inr(sub)}</b></td></tr><tr><td>Tax ${g}%</td><td class="num">${inr(tax)}</td></tr><tr><td><b>Total</b></td><td class="num"><b>${inr(sub+tax)}</b></td></tr></table>
 <h4>Cost intelligence ${S.est}</h4><div class="grid g2"><div class="kpi"><small>P50 expected cost (pre-tax)</small><b>${inr(q.p50)}</b></div><div class="kpi"><small>P80 – budget to discuss</small><b>${inr(q.p80)}</b></div></div><p class="small">${q.note}. Tell the customer the P80 figure as the realistic upper budget, and agree the checkpoint depths now.</p>
 <div class="row"><button class="btn sec sm" onclick='copyText(${JSON.stringify(txt)})'>Copy quote text</button></div></div>`}

/* ---- AI: Rig risk ---- */
function rigRisk(r){const why=[];let sc=0;const e=r.eng/250,c=r.comp/500,h=r.ham/6000,b=r.bit/1500;
 sc+=Math.min(30,e*30);if(e>.85)why.push(`Engine ${r.eng} h of 250 h service interval`);sc+=Math.min(25,c*25);if(c>.85)why.push(`Compressor ${r.comp} h of 500 h interval`);
 sc+=Math.min(20,h*20);if(h>.9)why.push(`Hammer ${r.ham.toLocaleString('en-IN')} ft – rebuild due ~6,000 ft`);sc+=Math.min(10,b*10);if(b>.9)why.push('Bit near end of life – check buttons/gauge');
 if(r.trend<-10){sc+=15;why.push(`Penetration down ${-r.trend}% vs 30-day average in same formation`)}
 sc=Math.round(Math.min(100,sc));const band=sc>=70?'High':sc>=45?'Medium':'Low';return{score:sc,band,c:sc>=70?'bad':sc>=45?'warn':'ok',why:why.length?why:['Within service intervals']}}
V['ai-rig']=()=>banner()+`<div class="card"><h3>Maintenance risk by rig</h3><div class="tw"><table><tr><th>Rig</th><th>Status</th><th>Risk</th><th>Drivers</th><th>Suggested action</th></tr>${RIGS.map(r=>{const s=rigRisk(r);return `<tr><td><b>${r.id}</b><br><span class="small muted">${r.type}</span></td><td>${r.status}</td><td style="min-width:120px">${pill(s.score+' · '+s.band,s.c)}<div class="bar" style="margin-top:5px"><div style="width:${s.score}%;background:${s.c==='bad'?'#c0392b':s.c==='warn'?'#b7791f':'#1a8a5a'}"></div></div></td><td class="small">${s.why.join('<br>')}</td><td class="small">${s.band==='High'?'Schedule service before next job; check hammer & compressor pressure':s.band==='Medium'?'Plan service within 1 week; monitor penetration':'No action'}</td></tr>`}).join('')}</table></div>
<p class="small muted">Score = weighted use against service intervals (engine 30, compressor 25, hammer 20, bit 10) + 15 if penetration trend drops >10%. Phase 2 replaces weights with a model trained on own breakdown history (telematics / hour-meter feed).</p></div>`;

const FS1=`Rig R-01, job BW-26-118 Oddanchatram. Start 7:30 end 18:00. Drilled 420 to 610 ft. 420-480 weathered rock brown cuttings, 480-560 fractured granite, water at 545 ft approx 1.5 inch, 560-610 hard grey granite. Diesel 310 L. Hammer pressure low after 590. Casing 60 ft done yesterday.`;
const FS2=`R-04 BW-26-121 Melur. start 8.00 end 5.30 pm. drilled 180 to 330 ft. 180-240 hard paarai grey, 240-300 udaintha paarai, thanni at 265 ft 1 inch, 300-330 hard paarai. diesel 260 L. compressor overheat 2 times.`;
V['ai-field']=()=>banner('Demo uses a rule-based parser. Production: speech-to-text (Tamil / English) + LLM extraction into the same fields, with the engineer confirming before save.')+`<div class="grid g2"><div class="card"><h3>Field notes (typed or voice transcript)</h3><textarea id="fc-t">${FS1}</textarea><div class="row" style="margin-top:8px"><button class="btn" onclick="fcRun()">Generate structured report</button><button class="btn sec sm" onclick="fcLoad(1)">Sample 1 (English)</button><button class="btn sec sm" onclick="fcLoad(2)">Sample 2 (Tamil-English mix)</button></div></div><div id="fc-out"></div></div>`;
function fcLoad(n){document.getElementById('fc-t').value=n===1?FS1:FS2;fcRun()}
function normForm(t){t=t.toLowerCase();if(/fractur|udaintha|broken/.test(t))return'Fractured gneiss';if(/weather|murrum/.test(t))return'Weathered rock';if(/soil|mann/.test(t))return'Topsoil';if(/hard|massive|granite|paarai/.test(t))return'Hard granite gneiss';return null}
function fcRun(){const t=document.getElementById('fc-t').value;const g=(re)=>{const x=t.match(re);return x?x:null};
 const rig=g(/\b(R-\d{2})\b/i),job=g(/\b(BW-\d{2}-\d{3})\b/i);const tm=g(/start\s*(\d{1,2})[:.](\d{2})\s*(am|pm)?[^]*?end\s*(\d{1,2})[:.](\d{2})\s*(am|pm)?/i);
 let hrs=null;if(tm){let s=+tm[1]+tm[2]/60,e=+tm[4]+tm[5]/60;if(tm[3]&&tm[3].toLowerCase()==='pm'&&+tm[1]<12)s+=12;if(tm[6]&&tm[6].toLowerCase()==='pm'&&+tm[4]<12)e+=12;if(e<=s)e+=12;hrs=+(e-s).toFixed(2)}
 const dr=g(/drilled\s*(?:from\s*)?(\d+)\s*(?:ft)?\s*(?:to|-)\s*(\d+)/i);const ints=[];const re=/(\d+)\s*-\s*(\d+)\s*(?:ft)?\s+([a-z][a-z ()]*)/gi;let x;while((x=re.exec(t))){const f=normForm(x[3]);if(f&&!/^bw/i.test(x[3]))ints.push({from:+x[1],to:+x[2],form:f,raw:x[3].trim()})}
 const ws=[];const wr=/(?:water|thanni)\s*(?:at|@)\s*(\d+)\s*ft(?:[^.,;\n]*?(\d+(?:\.\d+)?)\s*inch)?/gi;while((x=wr.exec(t)))ws.push({d:+x[1],inch:x[2]||null});
 const dz=g(/diesel\s*(\d+)\s*l/i),cs=g(/casing\s*(\d+)\s*ft/i);const issues=t.split(/[.\n]/).filter(s=>/low|leak|stuck|breakdown|jam|loss|caving|collapse|noise|overheat/i.test(s)).map(s=>s.trim());
 const ft=dr?dr[2]-dr[1]:null;const conf=[];if(!rig)conf.push('Rig not found');if(!job)conf.push('Job number not found');if(!hrs)conf.push('Working hours not found');if(!dr)conf.push('Drilled range not found');
 if(dr&&ints.length){const cov=ints.reduce((s,i)=>s+i.to-i.from,0);if(cov!==ft)conf.push(`Formation intervals cover ${cov} ft but drilled ${ft} ft`)}
 ws.forEach(w=>{if(w.inch)conf.push(`Water at ${w.d} ft reported as "${w.inch} inch" – field estimate; confirm with pump test (LPH)`)});
 let expD=null;if(ints.length)expD=Math.round(ints.reduce((s,i)=>s+(i.to-i.from)*expL(i.form),0));if(dz&&expD&&+dz[1]>expD*1.25)conf.push(`Diesel ${dz[1]} L vs expected ~${expD} L for these formations – verify`);
 const report=`DAILY DRILLING REPORT\nRig: ${rig?rig[1]:'?'}   Job: ${job?job[1]:'?'}\nHours: ${hrs??'?'}   Drilled: ${dr?dr[1]+'–'+dr[2]+' ft ('+ft+' ft)':'?'}   Avg rate: ${hrs&&ft?(ft/hrs).toFixed(1)+' ft/hr':'?'}\nFormations:\n${ints.map(i=>`  ${i.from}–${i.to} ft  ${i.form}`).join('\n')||'  ?'}\nWater strikes: ${ws.map(w=>w.d+' ft'+(w.inch?' (~'+w.inch+' inch, field est.)':'')).join(', ')||'none'}\nDiesel: ${dz?dz[1]+' L':'?'}${ft&&dz?' ('+(dz[1]/ft).toFixed(2)+' L/ft)':''}   Casing: ${cs?cs[1]+' ft':'not mentioned'}\nIssues: ${issues.join(' | ')||'none'}`;
 document.getElementById('fc-out').innerHTML=`<div class="card"><h3>Structured report ${S.ai}</h3><table><tr><th>Field</th><th>Extracted value</th></tr><tr><td>Rig / Job</td><td>${rig?rig[1]:'–'} / ${job?job[1]:'–'}</td></tr><tr><td>Hours</td><td>${hrs??'–'}</td></tr><tr><td>Drilled</td><td>${dr?dr[1]+' → '+dr[2]+' ft ('+ft+' ft)':'–'}</td></tr><tr><td>Formations</td><td>${ints.map(i=>`${i.from}–${i.to} ft: <b>${i.form}</b> <span class="small muted">("${esc(i.raw)}")</span>`).join('<br>')||'–'}</td></tr><tr><td>Water strikes</td><td>${ws.map(w=>'💧 '+w.d+' ft'+(w.inch?' · ~'+w.inch+' inch':'')).join('<br>')||'–'}</td></tr><tr><td>Diesel</td><td>${dz?dz[1]+' L':'–'} ${expD?`<span class="small muted">(expected ~${expD} L)</span>`:''}</td></tr><tr><td>Casing</td><td>${cs?cs[1]+' ft':'–'}</td></tr><tr><td>Issues → maintenance</td><td>${issues.map(i=>pill('Issue','warn')+' '+esc(i)).join('<br>')||'–'}</td></tr></table>
 <h4>Needs engineer confirmation</h4>${conf.length?`<ul class="clean">${conf.map(c=>`<li>${c}</li>`).join('')}</ul>`:'<p class="small">Nothing – ready to save.</p>'}
 <div class="row" style="margin-top:8px"><button class="btn ok sm" onclick="toast('Demo: report would be saved as Daily Drilling Log after confirmation')">Confirm & save to bore log</button><button class="btn sec sm" onclick='copyText(document.getElementById("fc-rep").textContent)'>Copy report</button></div><div class="mono" id="fc-rep" style="margin-top:10px">${esc(report)}</div></div>`}

/* ---- AI: Yield ---- */
V['ai-yield']=()=>banner()+`<div class="grid g2"><div class="card"><h3>Pump test readings</h3><div class="fg">
<div><label>Static water level (ft below ground)</label><input id="y-s" type="number" value="185"></div>
<div><label>Pumping rate (LPH)</label><input id="y-q" type="number" value="3600"></div>
<div><label>Test duration (hours)</label><input id="y-h" type="number" value="4"></div>
<div><label>Pumping water level at end (ft)</label><input id="y-p" type="number" value="342"></div>
<div><label>Level after 30 min recovery (ft)</label><input id="y-r1" type="number" value="290"></div>
<div><label>After 60 min (ft)</label><input id="y-r2" type="number" value="252"></div>
<div><label>After 120 min (ft)</label><input id="y-r3" type="number" value="221"></div>
<div><label>Bore depth (ft)</label><input id="y-d" type="number" value="640"></div>
<div><label>Required supply (LPH)</label><input id="y-req" type="number" value="2500"></div></div>
<div style="margin-top:10px"><button class="btn" onclick="yRun()">Analyse</button></div></div><div id="y-out"></div></div>`;
function yRun(){const s=+val('y-s'),q=+val('y-q'),h=+val('y-h'),p=+val('y-p'),r=[+val('y-r1'),+val('y-r2'),+val('y-r3')],d=+val('y-d'),req=+val('y-req');const dd=p-s;const sc=q/dd;const rec=r.map(x=>Math.max(0,Math.min(100,(p-x)/dd*100)));
 const cls=q<1000?['Low','bad']:q<3000?['Moderate','warn']:['Good','ok'];const slow=rec[2]<70;const safe=slow?q*.7:q*.85;const setD=Math.min(d-20,p+40);
 const obs=[];obs.push(`Drawdown ${dd} ft at ${q.toLocaleString('en-IN')} LPH → specific capacity ${sc.toFixed(1)} LPH per ft.`);obs.push(`Recovery: ${rec.map((x,i)=>['30','60','120'][i]+' min '+Math.round(x)+'%').join(', ')}.`);
 obs.push(slow?'Slow recovery (<70% in 2 h) – sustained yield likely lower than the test rate.':'Recovery is reasonable for the test duration.');if(safe<req)obs.push(`Suggested sustainable draw (~${Math.round(safe).toLocaleString('en-IN')} LPH) is below the required ${req.toLocaleString('en-IN')} LPH – discuss storage tank / staggered pumping.`);
 if(h<4)obs.push('Test shorter than 4 h – treat results as indicative.');
 document.getElementById('y-out').innerHTML=`<div class="card"><h3>Yield assessment ${S.est}</h3><div class="grid g2"><div class="kpi"><small>Test yield class (sample thresholds)</small><b>${pill(cls[0],cls[1])}</b><i>&lt;1,000 low · 1,000–3,000 moderate · &gt;3,000 good (LPH)</i></div><div class="kpi"><small>Indicative sustainable draw</small><b>${Math.round(safe).toLocaleString('en-IN')} LPH</b><i>${slow?'70%':'85%'} of test rate – rule of thumb, for review</i></div></div>
 <h4>Observations ${S.ai}</h4><ul class="clean">${obs.map(o=>`<li>${o}</li>`).join('')}</ul>
 <h4>Pump setting – for expert review</h4><p class="small">Indicative pump setting ≈ ${setD} ft (pumping level + 40 ft, at least 20 ft above bore bottom). Final pump selection and setting by a qualified person.</p>
 ${recSvg(s,p,r)}</div>`}
function recSvg(s,p,r){const W=420,H=150,pts=[[0,p],[30,r[0]],[60,r[1]],[120,r[2]]];const y=v=>10+(v-s+10)/(p-s+20)*(H-30),x=t=>40+t/120*(W-60);
 return `<svg viewBox="0 0 ${W} ${H}" width="100%"><line x1="40" x2="${W-20}" y1="${y(s)}" y2="${y(s)}" stroke="#1a8a5a" stroke-dasharray="4"/><text x="${W-20}" y="${y(s)-4}" font-size="10" text-anchor="end" fill="#1a8a5a">Static ${s} ft</text><polyline fill="none" stroke="#0b6e99" stroke-width="2" points="${pts.map(q=>x(q[0])+','+y(q[1])).join(' ')}"/>${pts.map(q=>`<circle cx="${x(q[0])}" cy="${y(q[1])}" r="3.5" fill="#0b6e99"/><text x="${x(q[0])}" y="${y(q[1])+14}" font-size="9.5" text-anchor="middle" fill="#5b6b80">${q[0]}m · ${q[1]}ft</text>`).join('')}<text x="40" y="${H-2}" font-size="10" fill="#5b6b80">Recovery after pumping stops (water level, ft below ground)</text></svg>`}
AFTER['ai-yield']=()=>yRun();

<div class="card" style="margin-top:14px"><h3>All exceptions</h3><div class="tw"><table><tr><th>Severity</th><th>Area</th><th>Reference</th><th>What needs attention</th><th></th></tr>${E.map(e=>`<tr><td>${pill(e.sev==='bad'?'High':'Medium',e.sev)}</td><td>${e.area}</td><td><b>${esc(e.ref)}</b></td><td>${e.msg}</td><td><button class="btn sec sm" onclick="go('${e.go}')">Open</button></td></tr>`).join('')}</table></div></div>`};

V['ai-customer']=()=>{const j=JOBS.find(x=>x.id===SEL.cust)||DONE[5];SEL.cust=j.id;const tk=TICKETS.filter(t=>t.job===j.id);const inv=INVOICES.find(i=>i.job===j.id);
 const sum=`${j.cust} – borewell ${j.id} at ${j.block}, ${j.dist}. Drilled ${fmtD(j.date)} by rig ${j.rig} to ${j.depth} ft (${m(j.depth)} m), casing ${j.cas} ft. ${j.strikes.length?'Water struck at '+j.strikes.join(' and ')+' ft':'No water strike recorded'}; ${j.yld?'recorded yield about '+j.yld.toLocaleString('en-IN')+' LPH'+(j.pump?' (pump test).':' (field estimate – no pump test on file).'):'outcome: '+j.outcome+'.'} ${tk.length?'Open service: '+tk.map(t=>t.issue+' ('+t.status+')').join('; ')+'.':'No service tickets.'} ${inv?'Invoice '+inv.no+': '+(inv.amt>inv.paid?inr(inv.amt-inv.paid)+' outstanding.':'paid.'):''}`;
 const reply=tk.length?`Vanakkam ${j.cust.split(' ')[0]}, we have noted the issue "${tk[0].issue}" for your borewell (${j.depth} ft, drilled ${fmtD(j.date)}). Our team will visit on the scheduled date and check yield and pump condition. Your bore record shows water at ${j.strikes.join(', ')||'–'} ft, so we will start with flushing and a yield check. We will share the result after the visit.`:`Vanakkam ${j.cust.split(' ')[0]}, thank you for contacting us about your borewell ${j.id} (${j.depth} ft). Please tell us what you are noticing – yield, water colour or pump – and we will arrange a visit.`;
 return banner('Demo summary is template-based from ERP records. Production: LLM writes the summary only from retrieved records (RAG) and cites the record it used.')+`<div class="card"><label>Borewell / customer</label><select onchange="SEL.cust=this.value;route()">${DONE.slice().reverse().map(x=>`<option value="${x.id}" ${x.id===j.id?'selected':''}>${x.id} · ${x.cust}</option>`).join('')}</select></div>
 <div class="grid g2"><div class="card"><h3>Borewell history summary ${S.ai}</h3><p>${sum}</p><p class="small muted">Sources: Job ${j.id}, bore log, ${tk.length?tk.map(t=>t.id).join(', ')+', ':''}${inv?inv.no:''}</p></div>
 <div class="card"><h3>Suggested reply (WhatsApp / SMS) ${S.ai}</h3><div class="mono">${esc(reply)}</div><div class="row" style="margin-top:8px"><button class="btn sec sm" onclick='copyText(${JSON.stringify(reply)})'>Copy reply</button></div><p class="small muted">Staff edit and send. Tamil version generated in production. Never promise yield recovery.</p></div></div>`};

const PERMITS=[['Land ownership / owner consent document','Before survey','All'],['Groundwater authority permission / NOC where the area or use requires it','Before drilling','Configure per state & category of area'],['Industrial / commercial use: extraction permission and metering','Before drilling','Industrial'],['Distance from existing wells, septic tanks and drinking water sources as per local rules','Site survey','All'],['Rig registration, insurance and driver documents valid','Before mobilisation','All'],['Crew safety: PPE, compressor hose checks, toolbox talk','Daily','All'],['Failed / unused bore safely capped and filled as per applicable safety guidelines (child safety)','Same day','Dry bores'],['Completion report & bore log handed to customer; water quality test advised','Handover','All']];
V['ai-permits']=()=>`<div class="banner blue">Rules differ by state and change over time. This checklist is configurable – the AI only reminds and checks that evidence is attached; it does not give legal advice.</div><div class="card"><h3>Compliance checklist – ${ACTIVE[2].id} (Industrial, Aruppukottai)</h3><div class="tw"><table><tr><th>Requirement</th><th>Stage</th><th>Applies to</th><th>Evidence</th><th>AI check</th></tr>${PERMITS.map((p,i)=>{const ok=i!==1&&i!==2&&i!==6;const na=i===6;return `<tr><td>${p[0]}</td><td>${p[1]}</td><td class="small">${p[2]}</td><td>${na?'–':ok?'📎 Attached':'—'}</td><td>${na?pill('Not yet applicable','grey'):ok?pill('OK','ok'):pill('Missing – block job start','bad')}</td></tr>`}).join('')}</table></div></div>
<div class="card"><h3>Dry-bore safety rule</h3><p>When a bore is recorded as <b>Dry</b> or abandoned, the system creates a mandatory "Cap & fill" task with photo evidence before the job can be closed. ${DONE.filter(j=>j.outcome==='Dry').length} dry bores in sample history.</p></div>`;

/* ---- AI: Accuracy ---- */
V['ai-accuracy']=()=>{const rows=[];const sorted=[...DONE].sort((a,b)=>a.date-b.date);sorted.forEach(j=>{if(j.outcome!=='Success')return;const prior=sorted.filter(x=>x.date<j.date&&x.dist===j.dist&&x.outcome==='Success');if(prior.length<3)return;rows.push({j,pred:med(prior.map(x=>x.depth)),pq:j.quote})});
 const mape=rows.reduce((s,r)=>s+Math.abs(r.pred-r.j.depth)/r.j.depth,0)/rows.length;const cv=DONE.reduce((s,j)=>s+(j.actual-j.quote)/j.quote,0)/DONE.length;
 const byD=Object.keys(REG).map(d=>{const rr=rows.filter(r=>r.j.dist===d);return{d,n:rr.length,e:rr.length?rr.reduce((s,r)=>s+Math.abs(r.pred-r.j.depth)/r.j.depth,0)/rr.length:null}});
 const W=440,H=260,mx=Math.max(...rows.map(r=>Math.max(r.pred,r.j.depth)))*1.05,X=v=>40+v/mx*(W-60),Y=v=>H-30-v/mx*(H-50);
 return `<div class="grid g4"><div class="kpi"><small>Depth forecasts evaluated</small><b>${rows.length}</b><i>Successful bores with ≥3 earlier records</i></div><div class="kpi"><small>Depth error (MAPE)</small><b>${Math.round(mape*100)}%</b><i>Median-of-history baseline</i></div><div class="kpi"><small>Avg cost variance vs quote</small><b>${cv>0?'+':''}${Math.round(cv*100)}%</b><i>All ${DONE.length} completed bores</i></div><div class="kpi"><small>Target before using in quotes</small><b>&lt; 20%</b><i>Set by management</i></div></div>
 <div class="grid g2" style="margin-top:14px"><div class="card"><h3>Predicted vs actual depth ${S.rec}</h3><svg viewBox="0 0 ${W} ${H}" width="100%"><line x1="${X(0)}" y1="${Y(0)}" x2="${X(mx)}" y2="${Y(mx)}" stroke="#cfd8e3" stroke-dasharray="4"/>${rows.map(r=>`<circle cx="${X(r.pred)}" cy="${Y(r.j.depth)}" r="4" fill="#0e9fb8" opacity=".75"><title>${r.j.id}: predicted ${Math.round(r.pred)} ft, actual ${r.j.depth} ft</title></circle>`).join('')}<text x="${W/2}" y="${H-6}" font-size="11" text-anchor="middle" fill="#5b6b80">Predicted depth (ft)</text><text x="12" y="${H/2}" font-size="11" fill="#5b6b80" transform="rotate(-90 12 ${H/2})" text-anchor="middle">Actual depth (ft)</text>${[0,.5,1].map(f=>`<text x="${X(f*mx)}" y="${H-18}" font-size="9" text-anchor="middle" fill="#8795a8">${Math.round(f*mx)}</text>`).join('')}</svg><p class="small muted">Points on the dashed line = perfect forecast. Each new completed bore is added automatically – the feedback loop.</p></div>
 <div class="card"><h3>Error by district</h3><table><tr><th>District</th><th class="num">Forecasts</th><th class="num">Depth MAPE</th><th>Use in quotes?</th></tr>${byD.map(b=>`<tr><td>${b.d}</td><td class="num">${b.n}</td><td class="num">${b.e===null?'–':Math.round(b.e*100)+'%'}</td><td>${b.n<5?pill('Not enough data','grey'):b.e<.2?pill('Yes, with review','ok'):pill('Advisory only','warn')}</td></tr>`).join('')}</table>
 <h4>Feedback captured on every AI output</h4><ul class="clean small"><li>👍 / 👎 + reason from engineer</li><li>Actual vs predicted stored per job (depth, cost, diesel, strike)</li><li>Monthly retraining only after accuracy review</li></ul></div></div>`};

${[['Phase 0 – data foundation','AI is only as good as the bore logs. Mandatory structured fields: GPS, depth-wise formation, strikes, yield, pump test, diesel, bit/hammer usage, cuttings photo','Bore Log Assistant'],

V.governance=()=>`<div class="grid g2"><div class="card"><h3>AI principles</h3><ul class="clean"><li>AI never promises that a borewell will produce water.</li><li>AI never decides drilling depth. It advises; a named person decides and the decision is logged.</li><li>Every AI figure is labelled ${S.rec}${S.ext}${S.est}${S.ai} with sample size and confidence.</li><li>The LLM writes text only from retrieved records; numbers come from calculations, never from the LLM's own knowledge.</li><li>No external geology claims without a named, dated source.</li><li>Customer data stays in the company's ERP; it is never used to train public models. A self-hosted model option is available.</li><li>Low-confidence outputs (fewer than 5 comparables) are shown as "advisory only".</li></ul></div>
